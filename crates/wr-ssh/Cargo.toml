[package]
name = "wr-ssh"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wr-core = { path = "../wr-core" }
wr-sftp = { path = "../wr-sftp" }
russh = "0.62"
async-trait = "0.1"
tokio.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
dirs = "6"
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
# Only for the config round-trip tests: session profiles are persisted as
# JSON by the app, so the serde shape of `SshConfig`/`AuthMethod` is a
# compatibility surface worth pinning here rather than only downstream.
serde_json.workspace = true
