[package]
name = "wrustty"
description = "A lightweight SSH/Telnet/Serial client"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows.
name = "wrustty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# An inspectable webview in a shipped installer is a wider surface than this
# app wants: the same process holds decrypted vault secrets and renders
# untrusted remote terminal output. `lib.rs` already caps third-party log
# levels in release for the same reason, so shipping devtools unconditionally
# contradicted that.
#
# This is a feature rather than a `cfg(debug_assertions)` dependency block
# because Cargo's `[target.'cfg(...)']` tables only evaluate target-related
# keys — `debug_assertions` is never set there, so both arms of such a split
# would apply and the gate would silently do nothing.
#
# `npm run tauri:dev` passes it. A plain `npm run tauri build` does not, and
# neither does CI's tagged release job.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
wr-core = { path = "../crates/wr-core" }
wr-fs = { path = "../crates/wr-fs" }
wr-ssh = { path = "../crates/wr-ssh" }
wr-sftp = { path = "../crates/wr-sftp" }
wr-vault = { path = "../crates/wr-vault" }
wr-telnet = { path = "../crates/wr-telnet" }
wr-serial = { path = "../crates/wr-serial" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tokio.workspace = true
async-trait = "0.1"
base64 = "0.22"
zeroize = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify-debouncer-full = "0.3"
tempfile = "3"
tauri-plugin-window-state = "2.4.1"
# Acrylic blur-behind for the background-transparency setting. Builds on
# every platform (its own platform-specific bits are internally cfg-gated),
# though only the Windows path is wired up here.
window-vibrancy = "0.6"
tauri-plugin-notification = "2.3.3"

[target.'cfg(windows)'.dependencies]
# Pinned to match whatever version wr-ssh's russh/pageant dependency
# pulls in on Windows (currently 0.62.x) rather than tauri's own version —
# without this, cargo resolves two separate copies of windows-core in the
# dependency graph (one per windows major/minor line, since 0.x releases
# aren't semver-compatible across minor bumps), and trait bounds like
# `Interface` fail to satisfy across the two copies even for structurally
# identical types. We never pass tauri's own HWND value directly into a
# function expecting this crate's HWND type — WebviewWindow::hwnd() is
# round-tripped through a plain isize first — so matching tauri's version
# specifically isn't required, only matching whatever else is already in
# the graph.
windows = { version = "=0.62.2", features = [
  "Security_Credentials_UI",
  # KeyCredentialManager and friends, for the TPM-backed vault unlock in
  # hello.rs; CryptographicBuffer/DataReader to move bytes in and out of the
  # IBuffers its sign API deals in.
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
  "Foundation",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Foundation",
  "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  # Reading HKCU\Software\SimonTatham\PuTTY\Sessions for the migration
  # importer in putty_import.rs. Read-only — nothing here ever writes to the
  # registry, and PuTTY's own keys are left exactly as found.
  "Win32_System_Registry",
] }
# IUserConsentVerifierInterop::RequestVerificationForWindowAsync's generic
# return type is `T: windows_core::Interface`, which we satisfy with
# `IAsyncOperation<UserConsentVerificationResult>` — but that type lives in
# this separate crate and the `windows` crate's own generated code refers
# to it by this crate name directly (not re-exported through
# `windows::Foundation`), so we need it as a direct dependency to name it.
windows-future = "=0.3.2"
# For ICoreWebView2Controller::MoveFocus (see verify_windows_hello_blocking
# in vault.rs) — already in the dependency graph transitively via wry, so
# this just names it as a direct dependency rather than pulling anything
# new in. Its own `windows` version (0.61.x, per its Cargo.toml) differs
# from the one pinned above, so this is a second copy of that crate in the
# graph — harmless here since nothing crosses between the two; we only
# call methods directly on the `ICoreWebView2Controller` this crate hands
# back, never mix its types with our own `windows::Win32::Foundation::HWND`.
webview2-com = "=0.38.2"
