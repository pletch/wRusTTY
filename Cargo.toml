[workspace]
resolver = "2"
members = ["src-tauri", "crates/wr-core", "crates/wr-ssh", "crates/wr-telnet", "crates/wr-serial", "crates/wr-vault", "crates/wr-sftp"]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["pletch"]
license = "MIT"
repository = ""

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
