name: CI

on:
  push:
    branches: [main]
    # Tags are what now trigger an actual installer build — see windows-build.
    tags: ['v*']
  pull_request:
  # Lets windows-build be run on demand without cutting a tag, for when you
  # want an installer out of CI mid-stream.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checking out and building needs nothing but read. Declared here rather than
# inherited from the repository default so the floor is visible in the file and
# doesn't quietly widen if that default changes — matching audit.yml. Any job
# needing more raises it for itself; see windows-build.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows-build:
    needs: [frontend, rust]
    # Not on every push. windows-latest bills at a 2x minute multiplier, and
    # a full Tauri release build plus NSIS/MSI bundling is by far the longest
    # job here — on a private repo that was the bulk of the Actions spend.
    #
    # It earned that cost back when development happened on Linux and this
    # was the only way to get a Windows installer at all. Development is on
    # Windows now, so a local `npm run tauri build` covers the day-to-day
    # case, and CI only needs to produce the artifact when there's a release
    # to hand someone.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # The one job that writes: tauri-action publishes the installer to a
    # release when this runs on a tag, which is what its GITHUB_TOKEN is for.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v7
        with:
          name: wrustty-windows-installer
          # src-tauri is a member of the root Cargo workspace, so build
          # output lands in the workspace-root `target/`, not a nested
          # `src-tauri/target/`.
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
