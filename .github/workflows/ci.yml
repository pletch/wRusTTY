name: CI

on:
  push:
    branches: [main]
    # Tags are what now trigger an actual installer build — see windows-build.
    tags: ['v*']
  pull_request:
  # Lets windows-build be run on demand without cutting a tag, for when you
  # want an installer out of CI mid-stream.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checking out and building needs nothing but read. Declared here rather than
# inherited from the repository default so the floor is visible in the file and
# doesn't quietly widen if that default changes — matching audit.yml. Any job
# needing more raises it for itself; see windows-build.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # package.json, package-lock.json, tauri.conf.json, Cargo.toml and
      # src/lib/version.ts each carry the version; this fails if a hand edit
      # moved only some.
      - run: node tools/version.mjs check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 30.0.16248370
      CMAKE_VERSION: 3.31.6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Gradle 8.14 can't run on anything newer.
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install the NDK and CMake, and point the C toolchain at them
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin" >> "$GITHUB_PATH"
          echo "$bin" >> "$GITHUB_PATH"
          {
            echo "NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
            echo "ANDROID_NDK=$ndk"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$bin/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      # Without this, desktop work quietly breaks what's gated for Android.
      - run: cargo clippy -p wrustty --lib --target aarch64-linux-android -- -D warnings
      # Only when asked for, like windows-build, since packaging is the long part. Debug
      # signed: release signing needs a key, which isn't in CI.
      - uses: actions/setup-node@v7
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
          cache: npm
      - name: Build a debug APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          npm ci
          # Git has it as not executable, since it was generated on Windows.
          chmod +x src-tauri/gen/android/gradlew
          npx tauri android build --debug --target aarch64 --apk
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: wrustty-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          retention-days: 7

  windows-build:
    needs: [frontend, rust]
    # Not on every push. windows-latest bills at a 2x minute multiplier, and
    # a full Tauri release build plus NSIS/MSI bundling is by far the longest
    # job here — on a private repo that was the bulk of the Actions spend.
    #
    # It earned that cost back when development happened on Linux and this
    # was the only way to get a Windows installer at all. Development is on
    # Windows now, so a local `npm run tauri build` covers the day-to-day
    # case, and CI only needs to produce the artifact when there's a release
    # to hand someone.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # The one job that writes: tauri-action publishes the installer to a
    # release when this runs on a tag, which is what its GITHUB_TOKEN is for.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # A tag publishes a release, so it must name the version the files
      # carry and have CHANGELOG entries to publish as the notes. Checked
      # here, before the long build, rather than after it.
      - name: Release notes from CHANGELOG
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node tools/version.mjs check "$GITHUB_REF_NAME"
          {
            echo 'body<<END_OF_NOTES'
            node tools/version.mjs notes "$GITHUB_REF_NAME"
            echo 'END_OF_NOTES'
          } >> "$GITHUB_OUTPUT"
      # tauri-action does NOT publish a release just because the workflow is
      # running on a tag — it uploads assets only when `tagName` is set, and
      # needs `releaseName` as well to create a release that doesn't exist yet.
      # Without both it silently builds and attaches nothing, which is what
      # happened here: the artifact below was the only output, and a workflow
      # artifact expires and needs a GitHub login to download.
      #
      # On workflow_dispatch these resolve to empty, which is the documented
      # way to say "build only" — a manual run must not publish a release
      # named after whatever branch it was dispatched from.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('wRusTTY {0}', github.ref_name) || '' }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ---

            Windows x64 installers — `.exe` (NSIS) or `.msi`.

            These are **not code signed**, so expect a SmartScreen warning on
            first run: *More info* → *Run anyway*.
          releaseDraft: false
      # Checksums of the installers exactly as published: downloaded back from
      # the release rather than hashed from the bundle directory, so they
      # describe the bytes a user actually gets. Attached as SHA256SUMS.txt
      # (`sha256sum -c` format, LF endings) and appended to the notes, so the
      # README's "check your download" has something to check against.
      - name: Publish SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $dir = Join-Path $env:RUNNER_TEMP 'published'
          gh release download $tag --repo $repo --pattern '*.exe' --pattern '*.msi' --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "could not download the installers from $tag" }
          $files = @(Get-ChildItem $dir -File | Sort-Object Name)
          if ($files.Count -ne 2) { throw "expected 2 installers on $tag, found $($files.Count)" }
          $sums = $files | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          $sumsFile = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          [IO.File]::WriteAllText($sumsFile, (($sums -join "`n") + "`n"))
          gh release upload $tag $sumsFile --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'could not attach SHA256SUMS.txt' }
          $body = (gh release view $tag --repo $repo --json body --jq .body) -join "`n"
          $fence = '```'
          $notes = @(
            $body.TrimEnd(), '', '### SHA-256', '', $fence, ($sums -join "`n"), $fence, '',
            'To check a download in PowerShell, run `Get-FileHash <file>` and compare the',
            'hash with the line above. The same list is attached as `SHA256SUMS.txt`.'
          ) -join "`n"
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          [IO.File]::WriteAllText($notesFile, $notes + "`n")
          gh release edit $tag --repo $repo --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'could not update the release notes' }
      - uses: actions/upload-artifact@v7
        with:
          name: wrustty-windows-installer
          # src-tauri is a member of the root Cargo workspace, so build
          # output lands in the workspace-root `target/`, not a nested
          # `src-tauri/target/`.
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
